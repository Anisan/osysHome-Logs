<style>
  .logs-errors-widget {
    min-height: 0;
  }

  .logs-errors-widget .logs-errors-count {
    font-size: clamp(1.75rem, 5vw, 3rem);
    line-height: 1.1;
  }

  .logs-errors-widget .logs-errors-caption {
    font-size: clamp(0.8rem, 2.5vw, 1rem);
  }
</style>
<div class="d-flex flex-column h-100 logs-errors-widget">
    <div class="d-flex align-items-center justify-content-between mb-2">
        <strong class="text-truncate">{{ _('Errors log') }}</strong>
    </div>
    <div class="flex-grow-1 d-flex flex-column justify-content-center text-center text-sm-start">
        <div class="logs-errors-count fw-bold {{ 'text-danger' if has_errors else 'text-success' }}">
            {{ error_count }}
        </div>
        <p class="logs-errors-caption text-muted mb-0">{{ _('Entries in errors.log') }}</p>
    </div>
    <div class="mt-3">
        <a class="btn btn-outline-primary btn-sm w-100" href="{{ logs_admin_url }}?file=errors.log">
            {{ _('Open logs') }}
        </a>
    </div>
</div>
